[project]
name = "skin-screening-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub[pandas-datasets]>=1.0.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# PyPI's Windows torch/torchvision wheels are CPU-only. Use PyTorch's CUDA 13.2
# index on Windows so local NVIDIA GPU training works; other platforms keep PyPI.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
